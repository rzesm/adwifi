[project]
name = "adwifi"
version = "0.1.0"
description = ""
authors = [
    {name = "rzes",email = "veirddd@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "dbus-next (>=0.2.3,<0.3.0)",
    "pygobject (>=3.56.3,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pygobject-stubs (>=2.17.0,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[project.scripts]
adwifi = "adwifi.main:main"

[tool.pytest.ini_options]
pythonpath = ["./"]
asyncio_mode = "auto"